<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="vesselGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5840" />
      <stop offset="50%" stop-color="#3b4733" />
      <stop offset="100%" stop-color="#2a3324" />
    </linearGradient>
    <linearGradient id="vesselGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c6b6d5" />
      <stop offset="60%" stop-color="#9a86ab" />
      <stop offset="100%" stop-color="#725f82" />
    </linearGradient>
    <linearGradient id="vesselGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#243449" />
      <stop offset="100%" stop-color="#152132" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="#f4efe7" />

  <!-- Textured studio wall wash -->
  <circle cx="450" cy="400" r="280" fill="#ded4e6" opacity="0.25" />
  <circle cx="280" cy="550" r="200" fill="#586749" opacity="0.12" />

  <!-- Studio wooden table / ledge in deep slate tone -->
  <rect x="80" y="660" width="640" height="180" fill="#1b2737" rx="2" />
  <line x1="80" y1="660" x2="720" y2="660" stroke="#0e1722" stroke-width="3" />

  <!-- Vessel shadows -->
  <ellipse cx="270" cy="685" rx="90" ry="16" fill="#0d141d" opacity="0.6" />
  <ellipse cx="460" cy="690" rx="75" ry="14" fill="#0d141d" opacity="0.5" />
  <ellipse cx="580" cy="680" rx="60" ry="12" fill="#0d141d" opacity="0.5" />

  <!-- Vessel 1: Olive Green Stoneware Jug -->
  <g transform="translate(180, 420)">
    <!-- Body -->
    <path d="M 40,240 C 0,220 -20,150 10,70 C 25,30 50,20 70,10 L 110,10 C 130,20 155,30 170,70 C 200,150 180,220 140,240 Z" 
          fill="url(#vesselGrad1)" stroke="#1a2533" stroke-width="2.5" />
    <!-- Jug rim -->
    <ellipse cx="90" cy="10" rx="25" ry="7" fill="#607054" stroke="#1a2533" stroke-width="2" />
    <!-- Jug ear / handle -->
    <path d="M 30,50 C -25,70 -30,140 15,160" fill="none" stroke="#2a3324" stroke-width="12" stroke-linecap="round" />
    <path d="M 30,50 C -25,70 -30,140 15,160" fill="none" stroke="#1a2533" stroke-width="3" />
    <!-- Highlight glaze -->
    <path d="M 50,80 C 40,130 50,180 70,220" fill="none" stroke="#879979" stroke-width="3" opacity="0.5" stroke-linecap="round" />
  </g>

  <!-- Vessel 2: Dusty Lilac Slender Bottle with dried botanical sprig -->
  <g transform="translate(390, 360)">
    <!-- Sprig emerging from neck -->
    <path d="M 70,60 Q 60,-50 100,-140" fill="none" stroke="#1c2838" stroke-width="2.5" />
    <path d="M 75,-20 Q 120,-40 140,-80" fill="none" stroke="#1c2838" stroke-width="1.8" />
    <ellipse cx="100" cy="-140" rx="9" ry="14" transform="rotate(20 100 -140)" fill="#586749" stroke="#1c2838" stroke-width="1.2" />
    <ellipse cx="140" cy="-80" rx="8" ry="12" transform="rotate(45 140 -80)" fill="#687859" stroke="#1c2838" stroke-width="1.2" />
    <ellipse cx="78" cy="-60" rx="7" ry="11" transform="rotate(-30 78 -60)" fill="#4e5b41" stroke="#1c2838" stroke-width="1.2" />

    <!-- Bottle body -->
    <path d="M 55,60 L 55,140 C 20,180 15,260 30,300 L 110,300 C 125,260 120,180 85,140 L 85,60 Z" 
          fill="url(#vesselGrad2)" stroke="#1a2533" stroke-width="2.5" />
    <!-- Neck rim -->
    <ellipse cx="70" cy="60" rx="16" ry="5" fill="#cfbfdf" stroke="#1a2533" stroke-width="2" />
    <!-- Lilac glaze specular light -->
    <path d="M 55,170 C 45,210 50,260 60,285" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.55" stroke-linecap="round" />
  </g>

  <!-- Vessel 3: Midnight Blue Low Bowl with Olive Leaves -->
  <g transform="translate(520, 530)">
    <path d="M 0,90 C 20,135 120,145 140,90 C 145,50 130,40 70,40 C 10,40 -5,50 0,90 Z" 
          fill="url(#vesselGrad3)" stroke="#0e1722" stroke-width="2.5" />
    <ellipse cx="70" cy="45" rx="65" ry="18" fill="#1b283b" stroke="#0e1722" stroke-width="2" />
    <!-- Olive fruit resting beside bowl -->
    <ellipse cx="160" cy="130" rx="14" ry="10" transform="rotate(20 160 130)" fill="#4d5a42" stroke="#141c26" stroke-width="1.5" />
  </g>

  <!-- Title & Medium -->
  <text x="100" y="885" font-family="'Caveat', Georgia, serif" font-size="22" fill="#4a5840" font-style="italic">
    "Three Vessels, Morning Light &amp; Wild Fennel"
  </text>
  <text x="100" y="910" font-family="Georgia, serif" font-size="12" fill="#1b2737" letter-spacing="2" opacity="0.65">
    OIL STICK &amp; DRY PIGMENT ON LINEN • 40 × 50 CM
  </text>
  <text x="700" y="910" font-family="Georgia, serif" font-size="13" fill="#1b2737" opacity="0.7" text-anchor="end">
    STUDIO SERIES 2026
  </text>
</svg>
