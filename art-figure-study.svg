<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="paperTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f3ea" />
      <stop offset="100%" stop-color="#eee7d9" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#paperTint)" />

  <!-- Expressive watercolor washes in Lilac and muted Olive -->
  <path d="M 280,240 C 420,200 550,260 580,380 C 600,480 520,620 440,680 C 350,750 240,680 200,560 C 160,430 200,270 280,240 Z"
        fill="#c2b0d3" fill-opacity="0.25" filter="url(#softGlow)" />
  <path d="M 340,420 C 460,390 530,460 520,580 C 510,680 430,780 340,790 C 270,800 230,710 260,600 Z"
        fill="#5a6b4a" fill-opacity="0.18" />

  <!-- Expressive gestural charcoal lines: seated figure reading or drawing -->
  <!-- Head & Hair silhouette -->
  <path d="M 370,220 C 340,210 320,230 310,260 C 300,290 320,320 350,330 C 380,340 410,320 410,280 C 410,240 390,220 370,220 Z" 
        fill="#1a2533" fill-opacity="0.8" />
  
  <!-- Neck and shoulder contour (Fluid dark blue charcoal stroke) -->
  <path d="M 340,320 C 330,360 280,390 240,430 C 210,470 200,530 200,600" 
        fill="none" stroke="#162233" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Back contour & spine curve -->
  <path d="M 380,300 C 430,340 480,420 490,520 C 500,620 460,700 420,780" 
        fill="none" stroke="#162233" stroke-width="5" stroke-linecap="round" />

  <!-- Arms cradling sketchbook / book -->
  <path d="M 240,440 C 290,480 360,510 420,500 C 450,490 480,450 490,440" 
        fill="none" stroke="#162233" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 210,540 C 260,560 320,560 380,540" 
        fill="none" stroke="#162233" stroke-width="3" stroke-linecap="round" />

  <!-- Hands & pencil detail in finer ink -->
  <path d="M 380,540 C 410,535 430,525 440,540 C 430,560 400,570 370,565" 
        fill="none" stroke="#162233" stroke-width="2.5" />
  <line x1="435" y1="520" x2="475" y2="480" stroke="#162233" stroke-width="2" stroke-linecap="round" />

  <!-- Lap, knees, drapery folds -->
  <path d="M 420,780 C 370,820 280,820 220,800 C 180,780 150,720 180,660" 
        fill="none" stroke="#162233" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 240,660 C 280,700 340,720 400,710" 
        fill="none" stroke="#526046" stroke-width="2.5" stroke-dasharray="8,4" />

  <!-- Quick artist gestural marks & charcoal smudges -->
  <line x1="280" y1="380" x2="310" y2="400" stroke="#162233" stroke-width="1.5" opacity="0.4" />
  <line x1="450" y1="360" x2="480" y2="390" stroke="#162233" stroke-width="1.8" opacity="0.4" />
  <line x1="260" y1="740" x2="320" y2="760" stroke="#162233" stroke-width="2" opacity="0.3" />

  <!-- Delicate color accents: lilac ribbon in hair, olive book cover -->
  <rect x="360" y="515" width="85" height="55" rx="3" transform="rotate(-12 360 515)" 
        fill="#5d6c4e" fill-opacity="0.8" stroke="#162233" stroke-width="1.5" />
  <path d="M 375,270 C 385,260 395,270 400,285" fill="none" stroke="#9d88af" stroke-width="3" stroke-linecap="round" />

  <!-- Studio Label -->
  <text x="120" y="880" font-family="'Caveat', Georgia, serif" font-size="22" fill="#526046" font-style="italic">
    "Study no. 27: The Reader at Half-Past Four"
  </text>
  <text x="120" y="908" font-family="Georgia, serif" font-size="12" fill="#162233" letter-spacing="2" opacity="0.65">
    RAW VINE CHARCOAL &amp; DRIED LAVENDER WATERCOLOR • 15 MIN STUDY
  </text>
  <text x="680" y="908" font-family="Georgia, serif" font-size="13" fill="#162233" opacity="0.7" text-anchor="end">
    LIFE SKETCHBOOK
  </text>
</svg>
