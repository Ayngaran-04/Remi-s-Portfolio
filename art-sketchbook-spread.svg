<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <filter id="bookShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#162233" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Wooden Studio Desk Ground -->
  <rect width="1000" height="700" fill="#ede7dc" />

  <!-- Open Sketchbook -->
  <g transform="translate(80, 50)" filter="url(#bookShadow)">
    <!-- Left page -->
    <path d="M 40,30 L 415,20 L 415,570 L 40,580 Z" fill="#faf7f0" stroke="#d5ccbe" stroke-width="1.5" />
    <!-- Right page -->
    <path d="M 425,20 L 800,30 L 800,580 L 425,570 Z" fill="#fdfcf8" stroke="#d5ccbe" stroke-width="1.5" />
    
    <!-- Spine shadow / gutter -->
    <rect x="412" y="18" width="16" height="554" fill="#0f1722" opacity="0.1" />
    <line x1="420" y1="20" x2="420" y2="570" stroke="#b3a593" stroke-width="1.5" />
    <!-- Stitch threads -->
    <circle cx="420" cy="120" r="3" fill="#8c7d6b" />
    <circle cx="420" cy="270" r="3" fill="#8c7d6b" />
    <circle cx="420" cy="420" r="3" fill="#8c7d6b" />

    <!-- Left Page Content: Hand Study & Swatches -->
    <!-- Hand drawing in graphite -->
    <g transform="translate(140, 140)">
      <path d="M 80,180 C 80,140 70,110 50,70 C 40,50 45,30 60,30 C 75,30 80,50 95,85" fill="none" stroke="#162233" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 95,85 C 105,50 115,20 130,20 C 145,20 145,45 135,80" fill="none" stroke="#162233" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 135,80 C 150,55 165,35 180,40 C 190,45 185,70 170,105" fill="none" stroke="#162233" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 170,105 C 185,85 200,80 205,95 C 210,115 190,140 160,175" fill="none" stroke="#162233" stroke-width="2" stroke-linecap="round" />
      <path d="M 50,110 C 30,120 10,135 15,155 C 20,175 40,165 70,170" fill="none" stroke="#162233" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 70,170 C 90,210 110,230 140,240" fill="none" stroke="#162233" stroke-width="3" stroke-linecap="round" />
      <path d="M 160,175 C 165,210 155,230 140,240" fill="none" stroke="#162233" stroke-width="2.5" />
      <!-- Palm contour shading -->
      <line x1="85" y1="120" x2="110" y2="150" stroke="#162233" stroke-width="1.2" opacity="0.4" />
      <line x1="105" y1="115" x2="130" y2="145" stroke="#162233" stroke-width="1.2" opacity="0.4" />
      <line x1="125" y1="120" x2="145" y2="145" stroke="#162233" stroke-width="1.2" opacity="0.4" />
    </g>

    <!-- Swatches on left bottom -->
    <text x="70" y="460" font-family="'Caveat', Georgia, serif" font-size="18" fill="#5b6a4e">
      palette trial:
    </text>
    <!-- Lilac swatch -->
    <rect x="70" y="475" width="45" height="35" rx="3" fill="#b9a8cb" />
    <text x="70" y="525" font-family="Georgia, serif" font-size="10" fill="#162233" opacity="0.6">#B9A8CB</text>
    <!-- Olive swatch -->
    <rect x="135" y="475" width="45" height="35" rx="3" fill="#5b6a4e" />
    <text x="135" y="525" font-family="Georgia, serif" font-size="10" fill="#162233" opacity="0.6">#5B6A4E</text>
    <!-- Dark Blue swatch -->
    <rect x="200" y="475" width="45" height="35" rx="3" fill="#192638" />
    <text x="200" y="525" font-family="Georgia, serif" font-size="10" fill="#162233" opacity="0.6">#192638</text>

    <!-- Annotation on left page -->
    <text x="70" y="80" font-family="'Caveat', Georgia, serif" font-size="20" fill="#5b6a4e">
      "October 14 — quick gesture of hands holding chalk"
    </text>

    <!-- Right Page Content: Swallows in Flight & Poem fragment -->
    <text x="460" y="80" font-family="'Caveat', Georgia, serif" font-size="20" fill="#5b6a4e">
      "Migration notes at 6pm"
    </text>

    <!-- Bird 1 in ink -->
    <path d="M 520,170 Q 560,135 600,165 Q 640,135 680,170 Q 610,160 520,170 Z" fill="#162233" />
    <path d="M 600,165 L 595,210 L 605,190 L 610,210 Z" fill="#162233" />

    <!-- Bird 2 in distance -->
    <path d="M 660,110 Q 685,90 710,105 Q 735,90 760,110 Q 715,103 660,110 Z" fill="#162233" opacity="0.65" />

    <!-- Pressed wildflower leaf with washi tape -->
    <g transform="translate(680, 360) rotate(15)">
      <path d="M 0,120 Q -5,60 10,0" fill="none" stroke="#505e44" stroke-width="2" />
      <ellipse cx="10" cy="15" rx="14" ry="7" transform="rotate(-30 10 15)" fill="#687858" />
      <ellipse cx="0" cy="45" rx="15" ry="8" transform="rotate(25 0 45)" fill="#5a6a4a" />
      <ellipse cx="8" cy="75" rx="16" ry="8" transform="rotate(-20 8 75)" fill="#4e5b3f" />
      <!-- Lilac washi tape -->
      <rect x="-18" y="55" width="45" height="16" fill="#c3b4d2" opacity="0.8" rx="1" transform="rotate(-6)" />
    </g>

    <!-- Handwritten prose on right page -->
    <text x="460" y="270" font-family="'Caveat', Georgia, serif" font-size="22" fill="#182536">
      "They cut through the twilight like scissors
    </text>
    <text x="460" y="305" font-family="'Caveat', Georgia, serif" font-size="22" fill="#182536">
      parting the blue silk of the air.
    </text>
    <text x="460" y="340" font-family="'Caveat', Georgia, serif" font-size="22" fill="#182536">
      Nothing kept. Everything remembered."
    </text>
    
    <text x="460" y="440" font-family="Georgia, serif" font-size="12" fill="#505e44" letter-spacing="1">
      SKETCHBOOK VOL. VII — FOLIO 34B
    </text>
  </g>

  <!-- Caption outside book -->
  <text x="500" y="665" font-family="Georgia, serif" font-size="13" fill="#192638" letter-spacing="2" text-anchor="middle" opacity="0.75">
    STUDIO DESK JOURNAL • MIXED MEDIA ON ARCHIVAL RAG PAPER
  </text>
</svg>
