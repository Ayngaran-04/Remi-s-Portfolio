<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1722" />
      <stop offset="40%" stop-color="#162233" />
      <stop offset="85%" stop-color="#24334a" />
      <stop offset="100%" stop-color="#34435b" />
    </linearGradient>
    <linearGradient id="curtainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6a3c6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#937fa4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#695679" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="sillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f4a36" />
      <stop offset="100%" stop-color="#2e3826" />
    </linearGradient>
  </defs>

  <!-- Background / Paper margin -->
  <rect width="800" height="1000" fill="#f4efe6" />

  <!-- Framed Nocturne Window -->
  <rect x="80" y="70" width="640" height="780" fill="url(#nightSky)" rx="4" />

  <!-- Stars (Delicate ink speckles) -->
  <circle cx="200" cy="180" r="1.5" fill="#f0ebe0" opacity="0.9" />
  <circle cx="350" cy="140" r="2" fill="#ded5e8" opacity="0.8" />
  <circle cx="500" cy="190" r="1.2" fill="#f0ebe0" opacity="0.7" />
  <circle cx="280" cy="240" r="1" fill="#ded5e8" opacity="0.6" />
  <circle cx="430" cy="270" r="1.5" fill="#f0ebe0" opacity="0.85" />
  <circle cx="580" cy="160" r="1.8" fill="#ded5e8" opacity="0.75" />

  <!-- Muted Moon (Drawn with soft gouache circle & lilac rim) -->
  <circle cx="450" cy="220" r="54" fill="#ebe4f2" opacity="0.92" />
  <circle cx="462" cy="214" r="50" fill="#24334a" opacity="0.95" />

  <!-- Distant hill contours -->
  <path d="M 80,480 Q 240,420 400,450 T 720,410 L 720,850 L 80,850 Z" fill="#141c27" opacity="0.75" />
  <path d="M 80,560 Q 300,510 520,540 T 720,500 L 720,850 L 80,850 Z" fill="#1a2533" opacity="0.9" />

  <!-- Window mullion architecture (Minimal dark blue structural lines) -->
  <line x1="80" y1="520" x2="720" y2="520" stroke="#0e1520" stroke-width="6" />
  <line x1="400" y1="70" x2="400" y2="850" stroke="#0e1520" stroke-width="6" />

  <!-- Soft Lilac Drapery falling from top right -->
  <path d="M 520,70 Q 560,300 620,440 Q 670,580 720,680 L 720,70 Z" fill="url(#curtainGrad)" opacity="0.85" />
  <!-- Fold shadows -->
  <path d="M 570,70 Q 600,280 650,420 Q 680,520 720,590" fill="none" stroke="#503d60" stroke-width="3" opacity="0.6" />
  <path d="M 640,70 Q 660,240 700,380" fill="none" stroke="#503d60" stroke-width="2.5" opacity="0.5" />

  <!-- Windowsill (Muted Deep Olive) -->
  <rect x="60" y="700" width="680" height="150" fill="url(#sillGrad)" />
  <line x1="60" y1="700" x2="740" y2="700" stroke="#162014" stroke-width="4" />

  <!-- Still life on sill: Cobalt/Dark Blue glass decanter & Olive sprig -->
  <!-- Glass bottle -->
  <path d="M 280,740 L 280,660 Q 280,630 300,610 L 300,560 L 320,560 L 320,610 Q 340,630 340,660 L 340,740 Z" 
        fill="#1d2e46" stroke="#0d1826" stroke-width="2.5" />
  <!-- Glass reflection highlight (Lilac-white) -->
  <path d="M 290,660 L 290,730" stroke="#ded5e8" stroke-width="2" opacity="0.45" stroke-linecap="round" />
  <ellipse cx="310" cy="560" rx="10" ry="3" fill="#324563" />

  <!-- Olive sprig emerging from bottle -->
  <path d="M 310,560 Q 320,480 290,400" fill="none" stroke="#162233" stroke-width="2.5" />
  <path d="M 310,500 Q 360,470 380,450" fill="none" stroke="#162233" stroke-width="2" />
  <!-- Olive leaves on sprig -->
  <path d="M 290,400 C 270,360 275,330 290,320 C 305,330 300,360 290,400 Z" fill="#6d7d5c" stroke="#141e2b" stroke-width="1.5" />
  <path d="M 320,440 C 350,420 370,425 380,440 C 365,455 335,455 320,440 Z" fill="#58654a" stroke="#141e2b" stroke-width="1.5" />
  <path d="M 350,460 C 390,450 415,460 420,475 C 395,485 365,480 350,460 Z" fill="#7d8f6b" stroke="#141e2b" stroke-width="1.5" />

  <!-- Single fallen olive on the sill -->
  <ellipse cx="230" cy="735" rx="11" ry="8" fill="#141d27" stroke="#0a1017" stroke-width="1.5" />
  <ellipse cx="228" cy="733" rx="3" ry="2" fill="#c4b5d3" opacity="0.7" />

  <!-- Handwritten Title & Caption -->
  <text x="100" y="895" font-family="'Caveat', Georgia, serif" font-size="22" fill="#3f4a36" font-style="italic">
    "Nocturne: Glass, Starlight &amp; Olive Branch"
  </text>
  <text x="100" y="922" font-family="Georgia, serif" font-size="12" fill="#162233" letter-spacing="2" opacity="0.65">
    GOUACHE &amp; CHARCOAL ON LINEN BOARD • 30 × 40 CM
  </text>
  <text x="700" y="922" font-family="Georgia, serif" font-size="13" fill="#162233" opacity="0.7" text-anchor="end">
    STUDIO ARCHIVE • 2026
  </text>
</svg>
